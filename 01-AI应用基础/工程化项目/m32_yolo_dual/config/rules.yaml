warn: 80.0
danger: 95.0
n_images: 12           # 课程数据缺失时合成兜底数据集张数
mask_dev: 15           # 保底路线 make_scene 对照用（tests/test_core.py）
min_area_px: 25
unit: "c"
seed: 7
topk: 3

# ---- 规范率：工单 M3.2《四、验收标准》未逐档写规范率门槛 ----
# 故规范率仅作实测展示（style_min 为报告展示线），不构成档位门；
# 档位门槛唯一出处是下方 tiers: 段（取自工单验收标准原文数字）。
style_min: 90.0

# ---- 实测链路参数（pipeline/core 全部从这里取数）----
dev_ref: 12.0          # 基线等效置信阈值（conf=0.4 档，见 thresholds）
min_area_ref: 15       # 连通域最小面积（px，imgsz 尺度）
imgsz_ladder: [160, 320, 640]   # 工单三档 imgsz
imgsz_ref: 320         # 阈值实验的对照尺寸（三档梯度之外的展示档）
fps_frames: 20         # 工单：20 帧平均
fps_warmup: 3          # 工单：warmup 3 帧
fps_reps: 5            # 每档重复 5 轮取中位数（本机实测计时噪声大，3 轮偶发降档）
mt_workers: 4          # 优化②多线程池宽
onnx_imgs: 12          # ONNX 路线阈值实验张数（真推理较慢，取子集并标明）
vis_count: 2           # 合格可视化图最少张数（与 tiers.d_min_vis_png 对齐）
iou_match: 0.3         # 真值命中判定 IoU 阈值

# ---- 工单 conf 四档 → 兜底口径 dev 等效阶梯（判定主路 cv2 用）----
# 映射依据：cv2 基线里 dev 就是"偏离产品中位色的灰度阈"，dev 越大越保守，
# 与 conf 升高同向；四档在报告里同时给出 ONNX 路线的 conf 原值实测。
thresholds:
  - conf: 0.25
    dev: 4.0
  - conf: 0.4
    dev: 12.0
  - conf: 0.6
    dev: 30.0
  - conf: 0.8
    dev: 50.0

# ---- 工单 M3.2《四、验收标准》四档数字门槛（判定逻辑在 src/yolo_dual/tiers.py）----
tiers:
  d_conf_levels: 4       # 及格(D)：阈值实验≥4 档（工单 conf 0.25/0.4/0.6/0.8）
  d_min_vis_png: 2       # 及格(D)：合格可视化图≥2 张（文件+字节+要素机检）
  c_imgsz_levels: 3      # 良好(C)：三档 imgsz 的 FPS 对比完整
  b_speedup_pct: 50.0    # 优秀(B)：较默认 imgsz=640 提速≥50%（工单原文）
  b_stable_runs: 3       # 优秀(B)：检出稳定=3 次复跑逐张检出数向量一致
  a_opt_gain_pct: 5.0    # 优(A)：工单只要求"量化提升"未给数字——取下界 5%
                         # 保证优化真实可复现，不是为绿灯凑数（实测远超此线）
  png_min_bytes: 1000    # 兜底口径（工单只写"结果图"未给字节下限）：判"非空白图"，非工单数字
  fps_min: 0.34          # 工单口径派生：产线节拍 3 秒/件（M3.2 工单首行+实验表"产线可用≥3s/件"）→ 1/3≈0.34 FPS
  iou_match: 0.3         # 命中判定 IoU（覆盖顶层同名键，档位段自带）
