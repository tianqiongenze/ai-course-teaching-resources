# M2.1 工业焊接缺陷检测 —— 规则外置（改配置不改代码）
# 四档门槛数值逐条取自《M2.1工单-工业焊接缺陷检测系统.md》"四、验收标准"，
# 由 config.py 现有加载机制读出（cfg.raw["tiers"]），进 tiers.verdict 判定；
# 能力门（增强对比/图表/误判样本）由 pipeline 实测，判不到就标 MISS。
warn: 80.0
danger: 95.0
unit: "c"
seed: 7
topk: 3

# ---- 工单 M2.1 四档准确率门槛（原文：D≥0.80 / C≥0.85 / B≥0.88 / A 达 B）----
# 工单原文未逐档规定"代码规范率"门槛，故档位判定不含规范率门（勿在此自创）。
tiers:
  acc_d: 0.80
  acc_c: 0.85
  acc_b: 0.88

# ---- 数据（真实课程数据 data/weld_images 缺失时自动降级四类合成兜底）----
test_size: 0.25          # 分层划分（工单：以整体测试集指标为准）
n_images: 240            # 兜底合成图像数（4 类均衡）
img_size: 64             # 工单口径 64×64 输入

# ---- tiny-CNN 训练参数（工单：2 卷积层，机房 CPU 可跑）----
# 3 轮 loss 下不到门槛线，训练轮数/学习率是达标手段可调、门槛不可调（降门槛=造假）。
# lr 必须 ≤0.003：实测 lr=0.01 时 Adam 在全连接 3136 维入口上早期爆更、
# ReLU 全体死亡，loss 卡死在 ln(4)≈1.386——这是当时"跑不通"的真因。
epochs: 40
lr: 0.003
batch: 64
ch1: 8
ch2: 16
aug_shift: 2             # 平移像素数（翻转/平移 = 工单 B 档原文能力）
deliver_arm: aug         # 判档用哪一臂（双臂同一测试集对比，不许挑图刷分）

# ---- 图表能力判定口径：png 真实落盘且字节大于该值才算"已绘制"----
min_png_bytes: 1000
lowconf_k: 2

# ---- 规范率实测仅作答辩证据（style_min 只控制证据段显示阈值，非档位门）----
style_min: 90.0

# ---- 旧轻量基线参数（零 torch 兜底路径保留可跑）----
cv_folds: 3
