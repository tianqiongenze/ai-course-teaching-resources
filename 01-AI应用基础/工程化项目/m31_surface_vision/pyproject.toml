[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "m31_surface_vision"
version = "1.0.0"
description = "表面缺陷传统视觉检测（01-AI应用基础 W08 第5次课）"
requires-python = ">=3.10"
dependencies = ["numpy", "Pillow", "opencv-python-headless"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "PyYAML>=6.0", "pycodestyle>=2.12"]
# 规范体检引擎：装了用业界标准，没装走 src/surface_vision/stylecheck.py 的内置兜底
style = ["pycodestyle>=2.12", "flake8>=7.0"]

[project.scripts]
m31_surface_vision = "surface_vision.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
pythonpath = ["src"]

# ── 编码规范体检配置（工单"代码规范率≥N%"的实测口径）──────────────
# src/surface_vision/stylecheck.py 读本节；等价命令：
#   python -m pycodestyle --max-line-length=100 run.py src tests
[tool.pycodestyle]
max-line-length = 100
ignore = ["E121", "E123", "E126", "E226", "E24", "E704", "W503", "W504"]

# flake8 本体不读 pyproject（需 flake8-pyproject 插件）；此处保持同口径，
# 装了插件即可直接 `python -m flake8 run.py src tests`。
[tool.flake8]
max-line-length = 100
ignore = ["E121", "E123", "E126", "E226", "E24", "E704", "W503", "W504"]

[tool.stylecheck]
scope = ["run.py", "src", "tests"]
