knowledge:
  - category: 设备运维规范
    text: 泵类设备振动速度有效值超过4.5mm/s应列入重点关注，超过7.1mm/s必须停机检查。
  - category: 设备运维规范
    text: 轴承温度报警阈值设定为75℃，达到85℃应立即停机并检查润滑与冷却回路。
  - category: 故障排查指南
    text: 泵体异响且压力波动：优先排查叶轮堵塞与汽蚀，检查进口滤网和液位。
  - category: 故障排查指南
    text: 电机电流偏高而转速正常：排查机械过载、轴承磨损与三相不平衡。
