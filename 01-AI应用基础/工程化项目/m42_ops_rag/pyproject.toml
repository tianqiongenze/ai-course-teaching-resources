[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "m42_ops_rag"
version = "1.0.0"
description = "RAG 运维知识库问答（01-AI应用基础 W11 第8次课）"
requires-python = ">=3.10"
dependencies = ["requests", "matplotlib"]
# requests 仅 core.llm_chat 真实调用/容错实测用，缺失时返回 MISS 并走确定性兜底；
# matplotlib 仅 prompt_compare.png 用，缺失时该产物记 MISS，不影响档位判定。

[project.optional-dependencies]
dev = ["pytest>=8.0", "PyYAML>=6.0", "pycodestyle>=2.12"]
# 规范体检引擎：装了用业界标准，没装走 src/ops_rag/stylecheck.py 的内置兜底
style = ["pycodestyle>=2.12", "flake8>=7.0"]

[project.scripts]
m42_ops_rag = "ops_rag.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
pythonpath = ["src"]

# ── 编码规范体检配置（工单"代码规范率≥N%"的实测口径）──────────────
# src/ops_rag/stylecheck.py 读本节；等价命令：
#   python -m pycodestyle --max-line-length=100 run.py src tests
[tool.pycodestyle]
max-line-length = 100
ignore = ["E121", "E123", "E126", "E226", "E24", "E704", "W503", "W504"]

# flake8 本体不读 pyproject（需 flake8-pyproject 插件）；此处保持同口径，
# 装了插件即可直接 `python -m flake8 run.py src tests`。
[tool.flake8]
max-line-length = 100
ignore = ["E121", "E123", "E126", "E226", "E24", "E704", "W503", "W504"]

[tool.stylecheck]
scope = ["run.py", "src", "tests"]
