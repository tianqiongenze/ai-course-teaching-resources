warn: 80.0
danger: 95.0
test_ratio: 0.2
max_features: 2000
stop_words:
  - 的
  - 了
  - 在
  - 已经
  - 发现
  - 需要
unit: "c"
seed: 7
topk: 3
# A 档调优项（外置参数，由 pipeline 实测加载与训练）
ngram_tune: 2
userdict: config/userdict.txt
# 库外新文本（工单"对 3 条新文本做预测验证"，实测超额给 6 条；库内文本不算，
# pipeline 实测核验。末条是真实仿写样本，模型判错也如实落报告——不挑数据）
new_texts:
  - text: 数控车床主轴轴承发热，润滑脂干涸
    expect: 传动系统
  - text: 配电柜接触器触点烧蚀，回路缺相跳闸
    expect: 电气系统
  - text: 液压站管路密封圈老化渗油，系统建压缓慢
    expect: 液压系统
  - text: 冷却塔填料结垢，冷却水流量不足水温降不下来
    expect: 冷却系统
  - text: 空压机气压波动大，气动夹爪夹紧力不足
    expect: 仪表气动
  - text: 气缸磁性开关不动作，到位信号缺失
    expect: 仪表气动
# 工单 M4.1《四、验收标准》数字门槛（判定逻辑在 tiers.py，本段只放数字）
tiers:
  style_gates:
    - 60.0
    - 70.0
    - 80.0
    - 90.0
  D:
    acc_min: 0.75
    new_min: 3
    match_min: 2
  C:
    acc_min: 0.8
    models_min: 2
  B:
    acc_min: 0.85
    topk: 10
  A:
    confusion: true
    tuning: true
