[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "m41_fault_text_clf"
version = "1.0.0"
description = "故障报告文本分类（01-AI应用基础 W10 第7次课）"
requires-python = ">=3.10"
dependencies = ["numpy", "scikit-learn"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "PyYAML>=6.0"]

[project.scripts]
m41_fault_text_clf = "fault_text_clf.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
pythonpath = ["src"]
