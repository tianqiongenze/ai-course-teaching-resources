# M1.2 特征工程优化的故障诊断系统 —— 规则外置（改配置不改代码）
warn: 80.0
danger: 95.0
unit: "c"
seed: 7
topk: 3

# ---- 数据与划分 ----
data_file: "pump_fault.csv"
test_size: 0.25

# ---- 现场采集视图（口径A）：可复现的采集缺陷注入 ----
# miss_rate: PLC 掉线写 0 的比例；spike_rate: 温度传感器满量程(135℃)尖峰行占比
# 设为 0 即回到实验室原样口径（报告同时给出口径B对照，不隐藏任何数字）
miss_rate: 0.15
spike_rate: 0.03
spike_value: 135.0

# ---- 消融与调参 ----
max_iter: 2000
cv_folds: 5
c_grid:
  - 0.01
  - 0.1
  - 1.0
  - 10.0
scalers:
  - none
  - standard
  - minmax

# ---- 物理量程校验表（判定"采集缺陷 vs 真实工况"的依据） ----
# 见 src/data_quality/core.py:PHYS_RANGES

# ---- 工单 M1.2 验收档位 ----
gain_d: 5.0            # 及格(D)：较基线提升 ≥5 个百分点
gain_c: 7.0            # 良好(C)：≥7 且消融记录完整
gain_b: 10.0           # 优秀(B)：≥10 且 macro-F1 ≥ 0.80
f1_b: 0.80
n_methods_a: 3         # 优(A)：≥3 种优化方法并有因果解释

# ---- 各档"规范率"门槛（工单 M1.2 只在 D 档明文写了"规范率≥70%"；
#      C/B/A 三档工单未写，取 M1.1《五、D/C/B/A 通用量表·代码规范》行 70/80/90）----
style_d: 70.0
style_c: 70.0
style_b: 80.0
style_a: 90.0

# ---- 既有脏数据画像（质量分口径） ----
n_rows: 300
temp_max: 120.0
vib_min: 0.0
vib_max: 15.0

# ---- 规范率门槛（报告段落用；实测值来自 src/data_quality/stylecheck.py） ----
# 工单 M1.2 明文：及格(D) 代码规范率≥70%；C/B/A 档取 M1.1 通用量表·代码规范行 70/80/90。
style_min: 90.0
